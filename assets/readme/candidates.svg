<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="296" viewBox="0 0 1200 296" role="img" aria-labelledby="title desc">
  <title id="title">Context-aware Pinyin candidates</title>
  <desc id="desc">Illustration: with the preceding text 计算面积要用, the Pinyin gongshi can yield 公式 as an AI candidate in the second slot of the Rime menu.</desc>
  <rect x="1" y="1" width="1198" height="294" rx="26" fill="#141f28" stroke="#607581" stroke-width="2"/>
  <g font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif">
    <text x="54" y="116" fill="#f4f8f9" font-size="50" font-weight="650">计算面积要用</text>
    <rect x="54" y="146" width="416" height="82" rx="14" fill="#253641"/>
    <text x="80" y="200" fill="#c4d3d9" font-size="43" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">gongshi</text>
    <path d="M273 169v37" stroke="#85e2c0" stroke-width="4" stroke-linecap="round"/>
    <path d="M510 148h121m-15-15 15 15-15 15" fill="none" stroke="#85e2c0" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="672" y="46" width="474" height="204" rx="18" fill="#253641"/>
    <path d="M693 148h432" stroke="#3a505c" stroke-width="2"/>
    <text x="706" y="115" fill="#c4d3d9" font-size="42">1</text>
    <text x="765" y="115" fill="#f4f8f9" font-size="46" font-weight="650">公示</text>
    <text x="1107" y="114" fill="#c4d3d9" font-size="34" text-anchor="end">Rime</text>
    <text x="706" y="201" fill="#c4d3d9" font-size="42">2</text>
    <text x="765" y="201" fill="#f4f8f9" font-size="46" font-weight="650">公式</text>
    <text x="1107" y="200" fill="#85e2c0" font-size="36" font-weight="700" text-anchor="end">AI</text>
  </g>
</svg>
